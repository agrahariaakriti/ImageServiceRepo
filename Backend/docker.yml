version: "3.8"
services:
  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_db
      MONGO_INITDB_ROOT_PASSWORD: password_db

  mongo-express:
    images: mongo-express
    ports:
      - "8080:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin_expree
      ME_CONFIG_MONGODB_ADMINPASSWORD: password_express
      ME_CONFIG_MONGODB_SERVER: mongodb
